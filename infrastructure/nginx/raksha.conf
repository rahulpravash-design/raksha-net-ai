# Reverse proxy for a single-host RAKSHA NET AI deployment.
#
# Managed platforms (ALB, Cloud Run, an ingress controller) do most of this
# themselves; this file documents what must be true wherever it is terminated.

upstream raksha_backend      { server backend:8000; }
upstream raksha_citizen      { server citizen-web:3000; }
upstream raksha_control      { server control-center:3001; }

# Reporting is deliberately generous: throttling must never become a denial of
# service against a genuine emergency. Credential endpoints are tighter.
limit_req_zone $binary_remote_addr zone=raksha_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=raksha_api:10m  rate=120r/m;

server {
    listen 80;
    server_name _;
    # Everything is TLS outside local development.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name raksha.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Matches RAKSHA_MEDIA_MAX_BYTES; the backend enforces it too, but failing
    # here avoids streaming a rejected upload all the way through.
    client_max_body_size 10m;

    location /api/v1/auth/ {
        limit_req zone=raksha_auth burst=5 nodelay;
        proxy_pass http://raksha_backend;
        include /etc/nginx/raksha-proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=raksha_api burst=40 nodelay;
        proxy_pass http://raksha_backend;
        include /etc/nginx/raksha-proxy-headers.conf;
    }

    location /ops/ {
        proxy_pass http://raksha_control/;
        include /etc/nginx/raksha-proxy-headers.conf;
    }

    location / {
        proxy_pass http://raksha_citizen;
        include /etc/nginx/raksha-proxy-headers.conf;
    }
}
