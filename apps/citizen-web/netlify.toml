# Netlify settings for this app (Next.js 16, in an npm workspace).
#
# Netlify dashboard, per site (Site configuration > Build & deploy > Continuous deployment):
#   Repository         rahulpravash-design/raksha-net-ai, production branch: main
#   Base directory     (leave empty: the repository root)
#   Package directory  apps/citizen-web      <- Netlify reads THIS file from there
#   Build command and Publish directory: leave as they are; this file overrides them.
#
# Both paths below are relative to the REPOSITORY ROOT, which is where Netlify resolves
# them when a Package directory is used. Getting that wrong fails like this (reproduced
# with Netlify's own build engine):
#   * `npm run build` at the root runs the root script, which builds all three apps, and
#   * `publish = ".next"` then points at <root>/.next, which never exists, so the Next.js
#     plugin fails: "Your publish directory was not found at: /opt/build/repo/.next".
# Do not also set a Base directory of apps/citizen-web: publish would then resolve to
# apps/citizen-web/apps/citizen-web/.next. The Next.js plugin is detected and installed by Netlify;
# it is deliberately not listed here. See docs/DEPLOYMENT.md section 13.2.
[build]
  command = "npm run build --workspace @raksha/citizen-web"
  publish = "apps/citizen-web/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
